<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="author" content="{{ site.owner_name }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:type" content="business.business">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.og_image }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="en_IN">

<!-- Schema.org LocalBusiness -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "{{ site.owner_name }} Social Media Management",
  "image": "{{ site.og_image }}",
  "telephone": "{{ site.phone_display }}",
  "priceRange": "₹8000 - ₹12000",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "S1, Second Floor, Shiv Kuber Complex, Ugandar Road",
    "addressLocality": "Porbandar",
    "postalCode": "360575",
    "addressRegion": "Gujarat",
    "addressCountry": "IN"
  },
  "areaServed": "Porbandar",
  "url": "{{ site.whatsapp_link }}",
  "email": "{{ site.contact_email }}",
  "sameAs": []
}
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Site styles -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

{% include navbar.html %}

{{ content }}

{% include footer.html %}

<a href="{{ site.whatsapp_link }}" target="_blank" class="whatsapp-float" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
