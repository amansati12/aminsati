# ---------------------------------------------------------------
# Contact form delivery settings
# ---------------------------------------------------------------
# Jekyll builds a static site, so the contact form can't run its own
# mail server. It POSTs to a form-relay service (Formspree) which
# forwards every submission straight to your inbox.
#
# Setup (5 minutes, free):
#   1. Go to https://formspree.io and sign up using satiamin786@gmail.com
#   2. Create a new form -> copy the endpoint, looks like:
#        https://formspree.io/f/abcdwxyz
#   3. Paste it below as form_endpoint
#   4. Formspree emails you a verification link the first time — click it
#   5. Done. Every submission on the live site now arrives at
#      satiamin786@gmail.com automatically.
#
# Alternative: EmailJS (fully client-side, no redirect) — see README.md
# ---------------------------------------------------------------
form_endpoint: "https://formspree.io/f/YOUR_FORM_ID"
